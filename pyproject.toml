[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlantic"
version = "2.0.31"
description = "Atlantic is an automated preprocessing framework for supervised machine learning"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Luís Fernando da Silva Santos", email = "luisf_ssantos@hotmail.com" },
]
keywords = [
    "data science",
    "machine learning",
    "data processing",
    "predictive modeling",
    "data preprocessing",
    "automated data preprocessing",
    "automated machine learning",
    "automl",
]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Telecommunications Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pandas>=2.0.0,<4.0.0",
    "numpy>=1.24.0,<3.0.0",
    "scikit-learn>=1.4.0,<2.0.0",
    "xgboost>=2.0.0,<3.0.0",
    "optuna>=3.0.0,<5.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "tqdm>=4.60.0",
    "dill>=0.3.6",
]

[project.optional-dependencies]
# H2O AutoML feature selection is optional: the pipeline runs without it
# (set relevance=1.0 or feature_selection method="none"). Requires a JVM.
h2o = ["h2o>=3.44.0.1"]
# statsmodels is only used by the test-suite, to cross-check the built-in VIF
# computation against statsmodels' reference implementation.
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "ruff>=0.4",
    "statsmodels>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/TsLu1s/Atlantic"
Repository = "https://github.com/TsLu1s/Atlantic"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = false
known_first_party = ["atlantic"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.black]
line-length = 100
target-version = ["py311"]
